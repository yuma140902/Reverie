name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      # Obtain a short-lived crates.io token using OIDC.
      id-token: write
      # Push tags and create GitHub Releases.
      contents: write
      # Find the release PR and generate release notes from it.
      pull-requests: read

    timeout-minutes: 60

    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo 'Run this workflow from the master branch.' >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
